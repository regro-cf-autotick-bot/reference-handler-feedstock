{% set name = "reference-handler" %}
{% set version = "0.9.4" %}
{% set sha256 = "f26feb90b59d78ec9c7e46a9b02d2d1465476675d383b98141d65d0f7c71213f" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/r/reference-handler/reference_handler-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - bibtexparser <2
    - python >={{ python_min }}

test:
  imports:
    - reference_handler
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/MolSSI/reference_handler
  summary: 'A Python package for creating a consolidated list of references (BibTex, RIS).'
  license: BSD-3-Clause
  license_file: LICENSE
extra:
  recipe-maintainers:
    - paulsaxe
